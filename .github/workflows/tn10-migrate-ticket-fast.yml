# Fast path: issue MigrateTickets without Rust/silverc.
# Uses Hub tip.ticketTemplate (already compiled at v3 deploy).
# Woken by Hub observe-burn after Kasplex opAccept (target Confirm under ~2 min).
name: TN10 migrate ticket (fast)

on:
  workflow_dispatch:
  repository_dispatch:
    types: [kcc20-ticket-needed]
  # Backup only; GitHub schedule can lag. Prefer Hub wake via workflow_dispatch.
  schedule:
    - cron: '*/5 * * * *'

concurrency:
  group: tn10-migrate-ticket-fast
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

jobs:
  issue-ticket:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: tools/tn10-migrate
    steps:
      - name: Checkout Hub
        uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Prefetch Hub tip + ticket template
        env:
          KREX_WRAP_HUB_URL: ${{ secrets.KREX_WRAP_HUB_URL }}
        run: |
          HUB_URL="${KREX_WRAP_HUB_URL:-https://hub.kasparex.com}"
          mkdir -p tkrex-migrate-deploy
          curl -fsSL "$HUB_URL/api/krex-wrap/mint-receipts?mode=mint-tip" -o /tmp/mint-tip.json || true
          node -e "
            const fs=require('fs');
            try {
              const j=JSON.parse(fs.readFileSync('/tmp/mint-tip.json','utf8'));
              if (!j || !j.tip) {
                console.error('No Hub tip yet');
                process.exit(1);
              }
              fs.writeFileSync('tkrex-migrate-deploy/MINT_TIP.json', JSON.stringify(j.tip,null,2)+'\n');
              const tt=j.tip.ticketTemplate;
              if (tt && tt.templatePrefix && tt.templateSuffix) {
                fs.writeFileSync('tkrex-migrate-deploy/ticket-template-parts.json', JSON.stringify(tt,null,2)+'\n');
                console.log('Wrote ticket-template-parts.json from Hub tip');
              } else {
                console.error('Hub tip missing ticketTemplate; run full TN10 migrate attestor once');
                process.exit(1);
              }
              console.log('Tip remainingAllowance=', j.tip.remainingAllowance, 'migrateVersion=', j.tip.migrateVersion);
            } catch (e) {
              console.error('Tip prefetch failed:', e.message);
              process.exit(1);
            }
          "

      - name: Materialize attestor keys (v3 ticket issue)
        env:
          TKREX_ATTESTOR1_PRIVKEY: ${{ secrets.TKREX_ATTESTOR1_PRIVKEY }}
          TKREX_ATTESTOR2_PRIVKEY: ${{ secrets.TKREX_ATTESTOR2_PRIVKEY }}
          TKREX_ATTESTOR3_PRIVKEY: ${{ secrets.TKREX_ATTESTOR3_PRIVKEY }}
        run: |
          mkdir -p tkrex-migrate-deploy
          for i in 1 2 3; do
            eval "k=\$TKREX_ATTESTOR${i}_PRIVKEY"
            if [ -n "$k" ]; then
              printf '%s\n' "$k" > "tkrex-migrate-deploy/.attestor${i}.privkey"
              echo "Wrote .attestor${i}.privkey"
            fi
          done

      - name: Attest + ticket-issue once (no silverc)
        env:
          KREX_WRAP_HUB_URL: ${{ secrets.KREX_WRAP_HUB_URL }}
          KCC20_BRIDGE_WATCHER_SECRET: ${{ secrets.KCC20_BRIDGE_WATCHER_SECRET }}
          KCC20_MIGRATE_AUTO_MINT: '1'
          TKREX_WALLET3_PRIVKEY: ${{ secrets.TKREX_WALLET3_PRIVKEY }}
          TKREX_ATTESTOR1_PRIVKEY: ${{ secrets.TKREX_ATTESTOR1_PRIVKEY }}
          TKREX_ATTESTOR2_PRIVKEY: ${{ secrets.TKREX_ATTESTOR2_PRIVKEY }}
          TKREX_ATTESTOR3_PRIVKEY: ${{ secrets.TKREX_ATTESTOR3_PRIVKEY }}
          TKREX_HUB_ROOT: ${{ github.workspace }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          export KREX_WRAP_HUB_URL="${KREX_WRAP_HUB_URL:-https://hub.kasparex.com}"
          if [ -z "$KCC20_BRIDGE_WATCHER_SECRET" ] || [ -z "$TKREX_WALLET3_PRIVKEY" ]; then
            echo "Missing KCC20_BRIDGE_WATCHER_SECRET or TKREX_WALLET3_PRIVKEY secrets"
            exit 1
          fi
          node scripts/tkrex-migrate-attestor.mjs --once

      - name: Sync ticket attestation to Hub store
        if: success()
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node tools/tn10-migrate/scripts/sync-ticket-attestations-to-hub.mjs
