# TN10 keyless migrate: attest sink burns + issue MigrateTickets (v3) or AUTO_MINT (v2 soak).
#
# Secrets:
#   KCC20_BRIDGE_WATCHER_SECRET
#   TKREX_WALLET3_PRIVKEY
#   KREX_WRAP_HUB_URL
#   TKREX_ATTESTOR1_PRIVKEY / TKREX_ATTESTOR2_PRIVKEY / TKREX_ATTESTOR3_PRIVKEY (v3 tickets)
name: TN10 migrate attestor

on:
  # Every 5 min is enough. cancel-in-progress:true + */2 cancelled free-tier
  # queued runs before a runner started, so tickets never issued.
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: tn10-migrate-attestor
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  attest-and-mint:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: tools/tn10-migrate
    steps:
      - name: Checkout Hub
        uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            tools/tn10-migrate/upstream/silverscript -> target

      - name: Bootstrap pinned silverc
        run: bash scripts/bootstrap-silverc.sh

      - name: Prefetch Hub mint tip
        env:
          KREX_WRAP_HUB_URL: ${{ secrets.KREX_WRAP_HUB_URL }}
        run: |
          HUB_URL="${KREX_WRAP_HUB_URL:-https://hub.kasparex.com}"
          mkdir -p tkrex-migrate-deploy
          curl -fsSL "$HUB_URL/api/krex-wrap/mint-receipts?mode=mint-tip" -o /tmp/mint-tip.json || true
          node -e "
            const fs=require('fs');
            try {
              const j=JSON.parse(fs.readFileSync('/tmp/mint-tip.json','utf8'));
              if (j && j.tip) {
                fs.writeFileSync('tkrex-migrate-deploy/MINT_TIP.json', JSON.stringify(j.tip,null,2)+'\n');
                console.log('Wrote tip remainingAllowance=', j.tip.remainingAllowance, 'migrateVersion=', j.tip.migrateVersion);
              } else console.log('No Hub tip yet');
            } catch (e) { console.log('Tip prefetch skipped:', e.message); }
          "

      - name: Materialize attestor keys (v3 ticket issue)
        env:
          TKREX_ATTESTOR1_PRIVKEY: ${{ secrets.TKREX_ATTESTOR1_PRIVKEY }}
          TKREX_ATTESTOR2_PRIVKEY: ${{ secrets.TKREX_ATTESTOR2_PRIVKEY }}
          TKREX_ATTESTOR3_PRIVKEY: ${{ secrets.TKREX_ATTESTOR3_PRIVKEY }}
        run: |
          mkdir -p tkrex-migrate-deploy
          for i in 1 2 3; do
            eval "k=\$TKREX_ATTESTOR${i}_PRIVKEY"
            if [ -n "$k" ]; then
              printf '%s\n' "$k" > "tkrex-migrate-deploy/.attestor${i}.privkey"
              echo "Wrote .attestor${i}.privkey"
            fi
          done

      - name: Attest + AUTO_MINT / ticket-issue once
        env:
          KREX_WRAP_HUB_URL: ${{ secrets.KREX_WRAP_HUB_URL }}
          KCC20_BRIDGE_WATCHER_SECRET: ${{ secrets.KCC20_BRIDGE_WATCHER_SECRET }}
          KCC20_MIGRATE_AUTO_MINT: '1'
          TKREX_WALLET3_PRIVKEY: ${{ secrets.TKREX_WALLET3_PRIVKEY }}
          TKREX_ATTESTOR1_PRIVKEY: ${{ secrets.TKREX_ATTESTOR1_PRIVKEY }}
          TKREX_ATTESTOR2_PRIVKEY: ${{ secrets.TKREX_ATTESTOR2_PRIVKEY }}
          TKREX_ATTESTOR3_PRIVKEY: ${{ secrets.TKREX_ATTESTOR3_PRIVKEY }}
          TKREX_HUB_ROOT: ${{ github.workspace }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          export KREX_WRAP_HUB_URL="${KREX_WRAP_HUB_URL:-https://hub.kasparex.com}"
          if [ -z "$KCC20_BRIDGE_WATCHER_SECRET" ] || [ -z "$TKREX_WALLET3_PRIVKEY" ]; then
            echo "Missing KCC20_BRIDGE_WATCHER_SECRET or TKREX_WALLET3_PRIVKEY secrets"
            exit 1
          fi
          node scripts/tkrex-migrate-attestor.mjs --once

      - name: Sync ticket attestation to main when Hub cannot persist
        if: success()
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const tipPath = 'tools/tn10-migrate/tkrex-migrate-deploy/TICKET_ISSUE_RESULT.json';
          const statePath = 'tools/tn10-migrate/tkrex-deploy/migrate-attestor-state.json';
          const attestPath = 'data/krex-wrap/attestations-tn10.json';
          const token = process.env.GH_TOKEN || process.env.GITHUB_TOKEN;
          const repo = process.env.GITHUB_REPOSITORY || 'Kasparex/kasparex-dapp-marketplace';
          if (!token) {
            console.log('No GH_TOKEN; skip sync');
            process.exit(0);
          }

          const tickets = [];
          if (fs.existsSync(tipPath)) {
            try {
              const ticket = JSON.parse(fs.readFileSync(tipPath, 'utf8'));
              if (ticket.ticketId && ticket.burnTxId) tickets.push(ticket);
            } catch { /* ignore */ }
          }
          if (fs.existsSync(statePath)) {
            try {
              const state = JSON.parse(fs.readFileSync(statePath, 'utf8'));
              for (const [burnTxId, entry] of Object.entries(state.nullifiers || {})) {
                if (!entry?.ticketId || !/^[a-f0-9]{64}:\d+$/i.test(entry.ticketId)) continue;
                if (tickets.some((t) => String(t.burnTxId).toLowerCase() === burnTxId.toLowerCase())) continue;
                tickets.push({
                  burnTxId,
                  ticketId: entry.ticketId,
                  ticketTxId: entry.ticketTxId || String(entry.ticketId).split(':')[0],
                  ticketIndex: entry.ticketIndex ?? 0,
                  amountRaw: entry.amountRaw,
                  from: entry.from,
                });
              }
            } catch { /* ignore */ }
          }
          if (tickets.length === 0) {
            console.log('No ticket results; skip sync');
            process.exit(0);
          }

          function applyTickets(store, list) {
            if (!Array.isArray(store.attestations)) store.attestations = [];
            let changed = 0;
            for (const ticket of list) {
              const burn = String(ticket.burnTxId).toLowerCase();
              let row = store.attestations.find((a) => String(a.burnTxHash || '').toLowerCase() === burn);
              if (!row) {
                row = {
                  network: 'testnet-10',
                  tick: 'TKREX',
                  burnTxHash: burn,
                  amountRaw: String(ticket.amountRaw || '0'),
                  amount: Number(ticket.amountRaw || 0) / 1e8,
                  from: ticket.from || '',
                  status: 'attested',
                  attestedAt: new Date().toISOString(),
                  migrateVersion: 3,
                };
                store.attestations.unshift(row);
                changed += 1;
              }
              if (row.ticketId === ticket.ticketId) continue;
              row.ticketId = ticket.ticketId;
              row.ticketTxId = ticket.ticketTxId || String(ticket.ticketId).split(':')[0];
              row.ticketIndex = Number(ticket.ticketIndex ?? 0);
              row.status = 'attested';
              row.note = 'TN10 v3: MigrateTicket issued; user Claims in Hub';
              row.migrateVersion = 3;
              if (ticket.amountRaw) {
                row.amountRaw = String(ticket.amountRaw);
                row.amount = Number(ticket.amountRaw) / 1e8;
              }
              if (ticket.from) row.from = ticket.from;
              changed += 1;
            }
            return changed;
          }

          async function loadRemote() {
            const res = await fetch(
              `https://api.github.com/repos/${repo}/contents/${attestPath}`,
              {
                headers: {
                  Authorization: `Bearer ${token}`,
                  Accept: 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
                },
              },
            );
            if (res.status === 404) {
              return {
                store: { network: 'testnet-10', updatedAt: new Date().toISOString(), attestations: [] },
                sha: undefined,
              };
            }
            if (!res.ok) throw new Error(`GET attestations ${res.status}`);
            const data = await res.json();
            const decoded = Buffer.from(data.content || '', data.encoding || 'base64').toString('utf8');
            return { store: JSON.parse(decoded), sha: data.sha };
          }

          async function putRemote(store, sha) {
            const body = `${JSON.stringify(store, null, 2)}\n`;
            const res = await fetch(
              `https://api.github.com/repos/${repo}/contents/${attestPath}`,
              {
                method: 'PUT',
                headers: {
                  Authorization: `Bearer ${token}`,
                  Accept: 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                  message: `chore(bridge): upsert TN10 migrate attestation (${store.updatedAt}) [skip vercel]`,
                  content: Buffer.from(body, 'utf8').toString('base64'),
                  sha,
                }),
              },
            );
            if (!res.ok) {
              const text = await res.text();
              throw new Error(`PUT attestations ${res.status}: ${text.slice(0, 300)}`);
            }
          }

          (async () => {
            let remote = await loadRemote();
            let changed = applyTickets(remote.store, tickets);
            if (!changed) {
              console.log('Attestations already have tickets; skip');
              process.exit(0);
            }
            remote.store.updatedAt = new Date().toISOString();
            fs.writeFileSync(attestPath, JSON.stringify(remote.store, null, 2) + '\n');
            // Contents API avoids git pull --rebase conflicts that left Confirm stuck.
            for (let attempt = 0; attempt < 3; attempt++) {
              try {
                await putRemote(remote.store, remote.sha);
                console.log(
                  'Pushed attestation tickets via Contents API',
                  tickets.map((t) => t.ticketId).join(', '),
                );
                process.exit(0);
              } catch (err) {
                console.warn('PUT attempt failed', err instanceof Error ? err.message : err);
                remote = await loadRemote();
                applyTickets(remote.store, tickets);
                remote.store.updatedAt = new Date().toISOString();
              }
            }
            throw new Error('Failed to sync attestations after retries');
          })().catch((err) => {
            console.error(err);
            process.exit(1);
          });
          NODE
