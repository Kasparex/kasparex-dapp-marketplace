name: Vercel Deploy

on:
  push:
    # Run on pushes to any branch (ensures Vercel preview/branch deploys)
    branches: ['**']
  pull_request:
    # Also trigger on pull request events
    branches: ['**']

jobs:
  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build --if-present

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v20
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          # Deploy previews for branch pushes; production deploys still occur when
          # push is to the production branch configured in Vercel (typically main).
          prod: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}

      - name: Print deployment info
        run: echo "Deployed via GitHub Actions to Vercel (production)."
