name: Track Deployments

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'data/krex-wrap/**'
      - 'data/updates.json'
      - 'docs/**'
      - '**/*.md'

concurrency:
  group: track-deployments-main
  cancel-in-progress: true

jobs:
  track-deployment:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Get commit information
        id: commit-info
        run: |
          COMMIT_SHA=$(git rev-parse HEAD)
          COMMIT_MESSAGE=$(git log -1 --pretty=%B)
          COMMIT_AUTHOR=$(git log -1 --pretty=%an)
          COMMIT_DATE=$(git log -1 --pretty=%cI)
          BRANCH=$(git rev-parse --abbrev-ref HEAD)

          echo "sha=$COMMIT_SHA" >> $GITHUB_OUTPUT
          echo "message<<EOF" >> $GITHUB_OUTPUT
          echo "$COMMIT_MESSAGE" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "author=$COMMIT_AUTHOR" >> $GITHUB_OUTPUT
          echo "date=$COMMIT_DATE" >> $GITHUB_OUTPUT
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT

      - name: Update timeline
        run: |
          if [ -f "data/updates.json" ]; then
            cat data/updates.json > updates_backup.json
          else
            echo '{"updates":[],"tasks":[],"ideas":[],"bugFixes":[]}' > updates_backup.json
          fi

          COMMIT_SHA="${{ steps.commit-info.outputs.sha }}"
          COMMIT_MESSAGE="${{ steps.commit-info.outputs.message }}"
          COMMIT_AUTHOR="${{ steps.commit-info.outputs.author }}"
          COMMIT_DATE="${{ steps.commit-info.outputs.date }}"
          BRANCH="${{ steps.commit-info.outputs.branch }}"
          ENTRY_ID="deploy-$(date +%s)-${COMMIT_SHA:0:7}"

          NEW_ENTRY=$(cat <<EOF
          {
            "id": "$ENTRY_ID",
            "title": "Deployment to $BRANCH",
            "description": "Website deployed successfully. Commit: $COMMIT_MESSAGE (by $COMMIT_AUTHOR)",
            "date": "$COMMIT_DATE",
            "type": "deployment"
          }
          EOF
          )

          node <<NODE_SCRIPT
          const fs = require('fs');
          let data;
          try {
            data = JSON.parse(fs.readFileSync('data/updates.json', 'utf8'));
          } catch (e) {
            data = { updates: [], tasks: [], ideas: [], bugFixes: [] };
          }
          const newEntry = JSON.parse(\`$NEW_ENTRY\`);
          const existingIndex = data.updates.findIndex(e => e.id && e.id.includes('${COMMIT_SHA:0:7}'));
          if (existingIndex === -1) {
            data.updates.unshift(newEntry);
          } else {
            data.updates[existingIndex] = newEntry;
          }
          const path = require('path');
          const dir = path.dirname('data/updates.json');
          if (!fs.existsSync(dir)) {
            fs.mkdirSync(dir, { recursive: true });
          }
          fs.writeFileSync('data/updates.json', JSON.stringify(data, null, 2));
          console.log('Timeline updated successfully');
          NODE_SCRIPT

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          if [ -n "$(git status --porcelain data/updates.json)" ]; then
            git add data/updates.json
            git commit -m "Auto-update: Track deployment from commit ${{ steps.commit-info.outputs.sha }}"
            git push
          else
            echo "No changes to commit"
          fi
