# Cloudflare Workers Configuration
# Documentation: https://developers.cloudflare.com/workers/wrangler/configuration/

# For Pages (frontend)
# Remix outputs to public/build for Cloudflare Pages
# Functions are in functions/ directory
pages_build_output_dir = "./public"

# For Workers (API)
name = "kasparex-api"
main = "workers/index.ts"
compatibility_date = "2024-01-01"

# KV Namespaces for caching
[[kv_namespaces]]
binding = "KASPAREX_CACHE"
id = "your-kv-namespace-id" # Replace with actual KV namespace ID after creation

# D1 Database for dynamic data
[[d1_databases]]
binding = "NODES_DB"
database_name = "kasparex-nodes"
database_id = "your-d1-database-id" # Replace with actual D1 database ID after creation

# R2 Buckets for asset storage
[[r2_buckets]]
binding = "ASSETS_BUCKET"
bucket_name = "kasparex-assets"

# Environment variables (set via wrangler secret put or dashboard)
# [vars]
# REGISTRY_CID = "your-registry-cid"
# PINATA_API_KEY = "your-pinata-key"
# STORACHA_API_KEY = "your-storacha-key"

# Production environment
[env.production]
name = "kasparex-api-production"

# Preview environment
[env.preview]
name = "kasparex-api-preview"



