# Cloudflare Workers Configuration
# Documentation: https://developers.cloudflare.com/workers/wrangler/configuration/

name = "kasparex-api"
main = "workers/index.ts"
compatibility_date = "2024-01-01"

# KV Namespaces for caching
[[kv_namespaces]]
binding = "KASPAREX_CACHE"
id = "2d35691ad6da46a69d725645273f44ac"
preview_id = "11f7cf16ec6f45309b57c6a3c7b42b12"

# KV Namespace for rate limiting
[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "c4db19a526a344e79109cf4faae746c8"
preview_id = "c2988fb2cfbf44e2a0a6e00e000997f1"

# D1 Database for dynamic data
[[d1_databases]]
binding = "NODES_DB"
database_name = "kasparex-nodes"
database_id = "ec15da5c-133a-4735-9cd6-afde1377577a"

# D1 Database for rewards (L1 reward distribution)
[[d1_databases]]
binding = "REWARDS_DB"
database_name = "kasparex-rewards"
database_id = "35760760-ee43-4ab4-b8c2-f9e134335acd"

# Environment variables (set via wrangler secret put or dashboard)
# [vars]
# REGISTRY_CID = "your-registry-cid"
# PINATA_API_KEY = "your-pinata-key"
# STORACHA_API_KEY = "your-storacha-key"

# Production environment
[env.production]
name = "kasparex-api-production"

[[env.production.kv_namespaces]]
binding = "KASPAREX_CACHE"
id = "2d35691ad6da46a69d725645273f44ac"
preview_id = "11f7cf16ec6f45309b57c6a3c7b42b12"

[[env.production.kv_namespaces]]
binding = "RATE_LIMIT"
id = "c4db19a526a344e79109cf4faae746c8"
preview_id = "c2988fb2cfbf44e2a0a6e00e000997f1"

[[env.production.d1_databases]]
binding = "NODES_DB"
database_name = "kasparex-nodes"
database_id = "ec15da5c-133a-4735-9cd6-afde1377577a"

[[env.production.d1_databases]]
binding = "REWARDS_DB"
database_name = "kasparex-rewards"
database_id = "35760760-ee43-4ab4-b8c2-f9e134335acd"

# Preview environment
[env.preview]
name = "kasparex-api-preview"

[[env.preview.kv_namespaces]]
binding = "KASPAREX_CACHE"
id = "2d35691ad6da46a69d725645273f44ac"
preview_id = "11f7cf16ec6f45309b57c6a3c7b42b12"

[[env.preview.kv_namespaces]]
binding = "RATE_LIMIT"
id = "c4db19a526a344e79109cf4faae746c8"
preview_id = "c2988fb2cfbf44e2a0a6e00e000997f1"

[[env.preview.d1_databases]]
binding = "NODES_DB"
database_name = "kasparex-nodes"
database_id = "ec15da5c-133a-4735-9cd6-afde1377577a"

[[env.preview.d1_databases]]
binding = "REWARDS_DB"
database_name = "kasparex-rewards"
database_id = "35760760-ee43-4ab4-b8c2-f9e134335acd"

# Cron triggers
# - Process rewards every 15 minutes
# - Archive old rewards daily at 2 AM UTC
[triggers]
crons = ["*/15 * * * *", "0 2 * * *"]

# Observability configuration for Workers Logs
[observability]
[observability.logs]
enabled = false
invocation_logs = true















